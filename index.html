<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Surprise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         SPACE BACKGROUND
    ========================== -->

    <div class="space">

        <div class="stars"></div>
        <div class="stars stars-2"></div>
        <div class="stars stars-3"></div>

        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>

        <div class="shooting-star star-1"></div>
        <div class="shooting-star star-2"></div>
        <div class="shooting-star star-3"></div>

    </div>


    <!-- =========================
         MAIN SCENE
    ========================== -->

    <main class="scene">

        <!-- CAT -->
        <div class="cat" id="cat">

            <div class="cat-ear left-ear"></div>
            <div class="cat-ear right-ear"></div>

            <div class="cat-head">

                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>

                <div class="nose"></div>

                <div class="mouth">
                    <span></span>
                </div>

                <div class="whisker w1"></div>
                <div class="whisker w2"></div>
                <div class="whisker w3"></div>

                <div class="whisker w4"></div>
                <div class="whisker w5"></div>
                <div class="whisker w6"></div>

            </div>

            <!-- PAWS -->
            <div class="paw paw-left"></div>
            <div class="paw paw-right"></div>

        </div>


        <!-- =========================
             CARD
        ========================== -->

        <section class="card-wrapper" id="cardWrapper">

            <div class="card" id="card">

                <!-- FRONT -->
                <div class="card-front">

                    <div class="card-small-title">
                        A LITTLE MESSAGE...
                    </div>

                    <h1>
                        I'm Sorry,
                        <span>Mahdia</span>
                    </h1>

                    <div class="card-line"></div>

                    <p class="front-subtitle">
                        I made something small for you.
                    </p>

                    <button id="openButton">
                        OPEN THE LETTER
                        <span>→</span>
                    </button>

                </div>


                <!-- LETTER -->
                <div class="card-letter" id="letter">

                    <div class="letter-glow"></div>

                    <div class="letter-content">

                        <div class="letter-label">
                            A LITTLE NOTE
                        </div>

                        <h2>
                            I'm Sorry, Mahdia
                        </h2>

                        <div class="letter-divider"></div>

                        <p id="typedText"></p>

                        <div class="signature" id="signature">
                            — From someone who cares 💜
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             FLOATING PARTICLES
        ========================== -->

        <div class="particles" id="particles"></div>

    </main>


    <!-- =========================
         FINAL SCREEN
    ========================== -->

    <div class="final-screen" id="finalScreen">

        <div class="final-glow"></div>

        <div class="final-content">

            <div class="final-icon">
                ✦
            </div>

            <h2>
                Thank you for reading.
            </h2>

            <p>
                Sometimes a little surprise
                can say what words can't.
            </p>

            <div class="final-hearts">
                💜 ✨ 💜
            </div>

            <button id="restartButton">
                START AGAIN ↻
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
