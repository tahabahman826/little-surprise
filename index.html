<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAHDIA CARD</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="space"></canvas>

    <main class="scene">

        <!-- ================= CAT ================= -->

        <div id="cat" class="cat">

            <div class="ear ear-left"></div>
            <div class="ear ear-right"></div>

            <div class="face">

                <div class="eye eye-left">
                    <span></span>
                </div>

                <div class="eye eye-right">
                    <span></span>
                </div>

                <div class="nose">
                    ♥
                </div>

                <div class="mouth">
                    ◡
                </div>

                <div class="whisker w1"></div>
                <div class="whisker w2"></div>
                <div class="whisker w3"></div>

                <div class="whisker w4"></div>
                <div class="whisker w5"></div>
                <div class="whisker w6"></div>

                <div class="tear tear-left"></div>
                <div class="tear tear-right"></div>

            </div>

            <div class="body">

                <div class="paw paw-left"></div>
                <div class="paw paw-right"></div>

            </div>

        </div>


        <!-- ================= CARD ================= -->

        <section id="card" class="card">

            <div class="card-shine"></div>

            <div class="card-inner">

                <div class="question-label">
                    A LITTLE QUESTION...
                </div>

                <h1>
                    Will you be<br>
                    my friend?
                </h1>

                <div class="divider"></div>

                <div class="buttons">

                    <button id="yesBtn" class="yes-btn">
                        YES <span>💙</span>
                    </button>

                    <button id="noBtn" class="no-btn">
                        NO
                    </button>

                </div>

            </div>

        </section>


        <!-- ================= FINAL ================= -->

        <section id="final" class="final hidden">

            <div class="final-icon">
                💙
            </div>

            <div class="final-hearts">
                ❤️ &nbsp; 💙
            </div>

            <h2>
                Thank youuu!
            </h2>

            <p>
                You made this little cat happy 🥹
            </p>

            <div class="restart">
                CLICK ANYWHERE TO RESTART
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
